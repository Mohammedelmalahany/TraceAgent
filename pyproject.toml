[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceagent"
version = "0.1.0"
description = "TraceAgent: Repository-Level Issue Localization Using Semantic Navigation (graduation project based on the SemNav paper)."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
